<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dandy&rsquo;s Gym Log</title>
<meta name="app-mode" content="pwa">
<meta name="theme-color" content="#1B232C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF1; --panel:#FFFFFF; --panel2:#F5F6F8; --ink:#1B232C; --muted:#5E6A77; --line:#D3D8DE;
  --plate:#1F5FBF; --plate-ink:#FFFFFF; --up:#1D7A46; --down:#B3261E; --goal:#B07800; --pr:#B07800;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171B20; --panel:#20262D; --panel2:#262D35; --ink:#E9EDF1; --muted:#98A3AF; --line:#333C46;
  --plate:#4C8BF0; --plate-ink:#0E1620; --up:#5FCB8D; --down:#F2807A; --goal:#F2C230; --pr:#F2C230; } }
:root[data-theme="dark"]{
  --bg:#171B20; --panel:#20262D; --panel2:#262D35; --ink:#E9EDF1; --muted:#98A3AF; --line:#333C46;
  --plate:#4C8BF0; --plate-ink:#0E1620; --up:#5FCB8D; --down:#F2807A; --goal:#F2C230; --pr:#F2C230; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
input,select{font:500 1rem "Barlow",sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:999px;background:var(--plate);color:var(--plate-ink);font-weight:700;padding:11px 20px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:.9rem}
.link{appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;font-weight:600;padding:6px 8px;border-radius:8px}
.link:hover{color:var(--ink)}
.muted{color:var(--muted)}

/* top */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font:800 clamp(2.2rem,7vw,3.2rem)/1 "Barlow Condensed",sans-serif;margin:0}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav button{appearance:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.weeknav span{font-weight:600;min-width:150px;text-align:center}
.weeksum{margin:6px 0 14px;color:var(--muted)}
.weeksum strong{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}
.chip.on{border:1.5px solid var(--plate);background:var(--plate);color:var(--plate-ink)}
/* week strip = the barbell */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.dayb{appearance:none;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 4px 9px;cursor:pointer;text-align:center;position:relative;min-width:0}
.dayb .dw{font-size:.78rem;color:var(--muted);font-weight:600}
.dayb .dt{font:700 1.15rem/1.1 "Barlow Condensed",sans-serif;margin:2px 0}
.dayb .dd{font-size:.75rem;color:var(--muted)}
.dayb.rest{background:transparent;border-style:dashed}
.dayb.rest .dt{color:var(--muted);font-weight:600}
.dayb.done{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.dayb.done .dw,.dayb.done .dd{color:var(--plate-ink);opacity:.85}
.dayb.sel{box-shadow:0 0 0 3px var(--ink)}
.dayb.today::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--goal)}
@media (max-width:520px){ .dayb .dd{display:none} .dayb .dt{font-size:.98rem} .strip{gap:4px} }

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:18px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;padding:10px 12px;flex:1 0 auto;font-weight:700;font-size:1rem;cursor:pointer;color:var(--muted);border-radius:10px 10px 0 0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* train */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dayhead h2{font:800 2.4rem/1 "Barlow Condensed",sans-serif;margin:0}
.dayhead .sub{color:var(--muted);margin-top:4px}
.typepick{display:flex;align-items:center;gap:8px}
.typepick select{width:auto;padding:7px 10px}
.sessbar{display:flex;gap:18px;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:12px 16px;margin-bottom:14px;align-items:center}
.sessbar .k{font:700 1.5rem/1 "Barlow Condensed",sans-serif}
.sessbar .l{font-size:.82rem;color:var(--muted)}
.sessbar .sp{flex:1}
.ex{background:var(--panel);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font:700 1.35rem/1.15 "Barlow Condensed",sans-serif;margin:0}
.last{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:.78rem;color:var(--muted);text-align:left;font-weight:600;padding:2px 4px}
.sets td{padding:4px}
.sets td.sn{font:700 1.1rem "Barlow Condensed",sans-serif;width:34px;color:var(--muted)}
.sets input{padding:7px 2px;min-width:52px;text-align:center;font:600 1.1rem "Barlow Condensed",sans-serif}
.sets td.chk{width:48px;text-align:center}
.tick{appearance:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:inline-grid;place-items:center;font-weight:800}
.tick[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
tr.isdone input{border-color:transparent;background:var(--panel2)}
.prb{font:700 .75rem "Barlow",sans-serif;color:var(--pr);border:1.5px solid var(--pr);border-radius:6px;padding:0 5px;margin-left:4px;visibility:hidden}
tr.pr .prb{visibility:visible}
.sets td.x{width:34px}
.sets th.lastc,.sets td.lastc{background:var(--panel2);border-radius:8px;text-align:center;width:84px;line-height:1.15;padding:4px 2px}
.lastv{display:block;font:600 1.05rem "Barlow Condensed",sans-serif;color:var(--muted)}
.lastv small{font-size:.7em;margin-left:1px}
.cmp{display:block;font:700 .78rem "Barlow",sans-serif;min-height:1em}
.cmp.up{color:var(--up)} .cmp.dn{color:var(--down)} .cmp.eq{color:var(--muted)}
.sets input::placeholder{color:var(--muted);opacity:.55}
.exsum{color:var(--up);font-weight:600}
.exfoot{display:flex;gap:6px;margin-top:4px}
.notes textarea{width:100%;min-height:70px;font:500 1rem "Barlow",sans-serif;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.restcard{background:var(--panel);border-radius:18px;padding:28px 22px;text-align:center}
.restcard h2{font:800 2.4rem "Barlow Condensed",sans-serif;margin:0 0 6px}
.preview{background:var(--panel);border-radius:16px;padding:6px 16px;margin-bottom:14px}
.preview .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.preview .row:last-child{border-bottom:0}
.preview .nm{font-weight:600}
.preview .lp{color:var(--muted);font-size:.92rem;text-align:right}
.addex{display:flex;gap:8px;margin:6px 0 16px}
.addex input{flex:1}

/* stats & charts */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:2px solid var(--ink);margin:6px 0 14px}
.stat{padding:10px 12px 10px 0}
.stat + .stat{padding-left:12px;border-left:1px solid var(--line)}
.stat .v{font:700 1.9rem/1.1 "Barlow Condensed",sans-serif}
.stat .l{color:var(--muted);font-size:.85rem}
@media (max-width:560px){ .stat:nth-child(odd){padding-left:0;border-left:0} .stat{border-top:1px solid var(--line)} }
.chart{overflow-x:auto;margin:6px 0 20px}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-top:-8px;margin-bottom:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
h3{font:700 1.5rem "Barlow Condensed",sans-serif;margin:26px 0 8px}
.tbl{overflow-x:auto}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-weight:600;color:var(--muted);font-size:.85rem;padding:8px;border-bottom:2px solid var(--ink)}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pos{color:var(--up)} .neg{color:var(--down)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.formrow{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px;align-items:end;background:var(--panel);border-radius:16px;padding:16px}
@media (max-width:640px){ .formrow{grid-template-columns:1fr 1fr} .formrow .wide{grid-column:1/-1} }
.msg{min-height:1.5em;margin:8px 2px;color:var(--muted);font-size:.95rem}

/* history */
.exlist{background:var(--panel);border-radius:16px;overflow:hidden}
.exrow{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"n c" "s c";text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.exrow:last-child{border-bottom:0}
.exrow:hover{background:var(--panel2)}
.exrow .en{grid-area:n;font:700 1.15rem/1.2 "Barlow Condensed",sans-serif}
.exrow .es{grid-area:s;font-size:.85rem;color:var(--muted)}
.exrow .chev{grid-area:c;align-self:center;font-size:1.5rem;color:var(--muted);padding-left:10px}
.back{padding-left:0;margin-bottom:2px}
.hname{font:800 2.2rem/1.05 "Barlow Condensed",sans-serif;margin:0 0 6px}
.seg{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;margin:4px 0 6px}
.seg button{appearance:none;border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
table.hist td.sc{white-space:nowrap;font-size:1.05rem;font-weight:600}
table.hist td.sc small{font-size:.7em;color:var(--muted)}
table.hist th,table.hist td{white-space:nowrap}
.exlink{appearance:none;border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer}
.exlink span{color:var(--muted)}
/* start picker */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.55);display:grid;place-items:center;padding:16px;z-index:10}
.scrim[hidden]{display:none}
.sheet{background:var(--panel);border-radius:22px;padding:22px 20px 16px;width:100%;max-width:440px;max-height:100%;overflow:auto}
.sheet h2{font:800 2rem/1.05 "Barlow Condensed",sans-serif;margin:4px 0 16px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer}
.pk b{display:block;font:800 1.5rem/1 "Barlow Condensed",sans-serif}
.pk span{font-size:.82rem;color:var(--muted)}
.pk.sched{border-color:var(--plate);box-shadow:inset 0 0 0 1px var(--plate)}
.pk.rest{grid-column:1/-1;border-style:dashed}
.pk:hover{border-color:var(--ink)}
.pk.did{opacity:.6}
.ordbar{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.exctl{display:flex;align-items:center;flex-shrink:0}
.exctl .link,.prow .ctl .link{min-width:34px;min-height:34px;font-size:1.05rem}
.link:disabled{opacity:.25;cursor:default}
.ordlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ordlist li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.ordlist .on{font:700 1.2rem "Barlow Condensed",sans-serif;color:var(--muted)}
.ordlist .nm{font-weight:600;line-height:1.2}
.ordlist .bt{display:flex}
.ordlist .bt button{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;width:38px;height:38px;margin-left:4px;cursor:pointer;font-size:1.05rem}
.ordlist .bt button:disabled{opacity:.3;cursor:default}
.ordlist li.moved{background:var(--panel2)}
.savechk{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:500;color:var(--ink);font-size:.95rem}
.savechk input{width:20px;height:20px;accent-color:var(--plate)}
.prow{grid-template-columns:1fr 60px auto}
.cardioform.time{grid-template-columns:1fr 1fr}
.cardioform{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}
.cardioform .cf label{font-size:.8rem}
.cardioform input{font:700 1.3rem "Barlow Condensed",sans-serif;text-align:center}
.wslot{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.92rem}
.dtlist{margin-bottom:10px}
.dtrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.dtrow:last-child{border-bottom:0}
.dtn{font-weight:600;flex:1}
.dtk{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px}
.dtk.lifting{color:var(--plate);border:1.5px solid var(--plate)}
.dtk.cardio{color:var(--goal);border:1.5px solid var(--goal)}
.dtb{font-size:.72rem;color:var(--muted)}
.adddt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.adddt input{flex:1 1 140px}
.adddt select{flex:1 1 120px;width:auto}
.wbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.wbar.on{border:1.5px solid var(--up)} .wbar.on span{color:var(--up);font-weight:600}
.wbar.off{color:var(--muted)}
.bulkcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.bcard{background:var(--panel);border-radius:14px;padding:12px 10px;text-align:center}
.bcard .bl{font-size:.8rem;color:var(--muted);font-weight:600}
.bcard .bv{font-size:1.9rem;font-weight:800;line-height:1.1;margin-top:2px}
.bcard .bv small{font-size:.42em;color:var(--muted);font-weight:600}
.bcard .dim{color:var(--muted)}
.bcard.good{background:color-mix(in srgb,var(--up) 14%,var(--panel))} .bcard.good .bv{color:var(--up)}
.bcard.bad{background:color-mix(in srgb,var(--down) 14%,var(--panel))} .bcard.bad .bv{color:var(--down)}
@media (max-width:420px){ .bcard .bv{font-size:1.5rem} }
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pnav span{font-weight:700;font-size:1.1rem}
.pnav button{appearance:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1.1rem}
.pnav button:disabled{opacity:.3;cursor:default}
.ptotal{background:var(--panel);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.pbig{font-size:clamp(3.6rem,16vw,5.5rem);font-weight:800;line-height:.9}
.pbig small{font-size:.35em;color:var(--muted);font-weight:600}
.pgoal{margin:6px 0 10px;color:var(--muted)} .pgoal b{color:var(--ink)} .pgoal b.pos{color:var(--up)}
.pbar{height:12px;background:var(--panel2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--plate);border-radius:999px;transition:width .3s}
.padd{display:flex;gap:8px}
.padd input{flex:1;font:700 1.3rem "Barlow Condensed",sans-serif}
.pquick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pquick button{appearance:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.pquick button:active{background:var(--plate);color:var(--plate-ink)}
.plist{background:var(--panel);border-radius:16px;padding:4px 14px}
.pit{display:grid;grid-template-columns:60px 1fr auto;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pit:last-child{border-bottom:0}
.pit b{font-size:1.25rem}
.pgoalset{max-width:360px;margin-top:6px}
.btn.danger{background:var(--down);color:#fff}
/* plan */
.plan{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}
.plan h4{font:700 1.4rem "Barlow Condensed",sans-serif;margin:0 0 8px}
.prow{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:center;margin-bottom:6px}
.prow .ctl{display:flex}
@media (prefers-reduced-motion:no-preference){ .tick[aria-pressed="true"]{animation:thunk .18s ease-out} @keyframes thunk{50%{transform:scale(.88)}} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Dandy’s Gym Log</h1>
    <div class="weeknav">
      <button type="button" id="prevW" aria-label="Previous week">‹</button>
      <span id="weekLbl"></span>
      <button type="button" id="nextW" aria-label="Next week">›</button>
    </div>
  </div>
  <p class="weeksum" id="weekSum"></p>
  <div class="strip" id="strip"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="train" aria-selected="true">Workout</button>
    <button class="tab" role="tab" data-t="protein" aria-selected="false">Protein</button>
    <button class="tab" role="tab" data-t="progress" aria-selected="false">History</button>
    <button class="tab" role="tab" data-t="weekly" aria-selected="false">Weekly</button>
    <button class="tab" role="tab" data-t="bulk" aria-selected="false">Bulk</button>
    <button class="tab" role="tab" data-t="body" aria-selected="false">Body</button>
    <button class="tab" role="tab" data-t="plan" aria-selected="false">Plan</button>
  </div>
  <main id="view"></main>
  <div class="scrim" id="cfm" hidden>
    <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cfmT" aria-describedby="cfmB">
      <h2 id="cfmT" style="margin-bottom:6px"></h2><p id="cfmB" class="muted" style="margin:0 0 18px"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" id="cfmNo">Cancel</button><button class="btn danger" id="cfmOk"></button></div>
    </div>
  </div>
  <div class="scrim" id="ord" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ordT">
      <h2 id="ordT" style="margin-bottom:4px">Exercise order</h2>
      <p class="muted" style="margin:0 0 12px;font-size:.92rem">Tap ⤒ to make an exercise first, or nudge with ↑ ↓.</p>
      <ol class="ordlist" id="ordList"></ol>
      <label class="savechk"><input type="checkbox" id="ordSave" checked><span>Use this order for future <span id="ordType"></span> workouts</span></label>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="ordDone">Done</button></div>
    </div>
  </div>
  <div class="scrim" id="pick" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickT">
      <p class="muted" id="pickDate" style="margin:0"></p>
      <h2 id="pickT">What are you training today?</h2>
      <div class="picks" id="picks"></div>
      <button class="link" id="pickSkip" style="margin-top:6px">Just looking at my progress</button>
    </div>
  </div>
</div>

<script>
/* ================= constants ================= */
const BUILTIN_TYPES = {push:"Push",pull:"Pull",legs:"Legs",upper:"Upper",lower:"Lower"};
const REST="rest";
// custom day types live in S.settings.dayTypes: [{key,name,kind}] kind = "lifting" | "cardio"
function dayTypeList(){ // ordered: built-ins then custom
  const built=Object.keys(BUILTIN_TYPES).map(k=>({key:k,name:BUILTIN_TYPES[k],kind:"lifting",builtin:true}));
  const custom=(S.settings.dayTypes||[]).map(d=>({...d,builtin:false}));
  return built.concat(custom);
}
function dayType(k){ return dayTypeList().find(x=>x.key===k) || {key:k,name:TYPES_NAME(k),kind:"lifting"}; }
function TYPES_NAME(k){ if(k===REST) return "Rest"; if(BUILTIN_TYPES[k]) return BUILTIN_TYPES[k]; const c=(S.settings.dayTypes||[]).find(d=>d.key===k); return c?c.name:k; }
function isCardio(k){ const d=(S.settings.dayTypes||[]).find(x=>x.key===k); return !!(d&&d.kind==="cardio"); }
function cardioMode(k){ const d=(S.settings.dayTypes||[]).find(x=>x.key===k); return d&&d.mode==="time"?"time":"distance"; }
// compat shim: TYPES[k] and TRAIN_TYPES used widely
const TYPES=new Proxy({},{get:(_,k)=>k===REST?"Rest":TYPES_NAME(String(k))});
function trainTypes(){ return dayTypeList().map(x=>x.key); }
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const PLAN_VERSION = 2;
const DEFAULT_TEMPLATES = (()=>{ const t=a=>a.map(name=>({name,sets:3})); return {
  push:t(["Incline Dumbbell Press","Chest Flies","Flat Dumbbell Press","Shoulder Press","Lateral Raises","Single-Arm Tricep Pushdown","Overhead Tricep Extension"]),
  pull:t(["Lat Pulldown","Close-Grip Row","Lat Machine","Seated Bicep Curl","Hammer Curl Machine","Forearm Curls"]),
  legs:t(["Leg Raises","Hamstring Curls","Leg Press","Pendulum Squat","Calf Raises"]),
  upper:t(["Incline Dumbbell Press","Chest Flies","Shoulder Press","Lateral Raises","Lat Pulldown","Close-Grip Row","Cable Bicep Curl","Cable Tricep Pressdown"]),
  lower:t(["Leg Raises","Hamstring Curls","Leg Press","Pendulum Squat","Calf Raises"])
};})();

/* ================= state ================= */
let S = { settings:{ goalKg:70, planVersion:PLAN_VERSION, proteinGoal:140, templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)) }, bw:[], weeks:{}, protein:{}, cals:{} };
let protDay=null, bulkDay=null;
let whoop={connected:false,days:{},checked:false};
let tab = "train", sel = iso(new Date());
let mainRef = null, weeksCol = null;

/* ================= dates ================= */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function dowIdx(s){return (parse(s).getDay()+6)%7}
function weekStart(s){return addDays(s,-dowIdx(s))}
const fmtD = s => parse(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const fmtDY = s => parse(s).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const fmtLong = s => parse(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const today = () => iso(new Date());

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1 = n => { const r=Math.round(n*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); };
const signed = n => (n>0.05?"+":n<-0.05?"−":"±")+f1(Math.abs(n));
const num = v => { const n=parseFloat(v); return isFinite(n)?n:null; };
const e1rm = (w,r) => (w>0&&r>0) ? (r===1?w:w*(1+r/30)) : 0;
function doneInWeek(k,d){ const ws=weekStart(d); for(let i=0;i<7;i++){ const x=addDays(ws,i), s=session(x); if(s&&s.type===k&&sessionActive(s)&&x!==d) return x; } return null; }
function suggestOrder(d){ return trainTypes().map(k=>({k,wk:doneInWeek(k,d),last:lastOfType(k,d)}))
  .sort((a,b)=>(!!a.wk-!!b.wk)||((a.last||"")<(b.last||"")?-1:(a.last||"")>(b.last||"")?1:0)); }
function typeButtons(d){ const o=suggestOrder(d), sug=o[0]&&!o[0].wk?o[0].k:null;
  return trainTypes().map(k=>o.find(x=>x.k===k)).map(x=>{ const g=x.k===sug; return `<button class="pk ${g?"sched":""} ${x.wk?"did":""}" data-k="${x.k}"><b>${TYPES[x.k]}</b><span>${
  x.wk?`Done this week ✓ ${DOW[dowIdx(x.wk)]}`:(g?"Suggested · ":"")+(x.last?"last "+fmtD(x.last):"not logged yet")}</span></button>`; }).join(""); }
function session(d){ const w=S.weeks[weekStart(d)]; return w&&w.sessions?w.sessions[d]:null; }
function doneSets(ex){ return ex.sets.filter(s=>s.done && num(s.w)!=null && num(s.r)>0); }
function cardioLogged(s){ if(!s||!s.cardio) return false; const c=s.cardio; return (+c.dist>0)||(+c.mins>0)||(+c.hrs>0)||(c.note&&c.note.trim()); }
function sessionActive(s){ if(!s) return false; if(s.kind==="cardio") return s.finished||cardioLogged(s); return s.finished || (s.ex||[]).some(e=>doneSets(e).length); }
function allSessions(){ const out=[]; for(const w of Object.values(S.weeks)) for(const [d,s] of Object.entries(w.sessions||{})) out.push({date:d,...s}); return out.sort((a,b)=>a.date.localeCompare(b.date)); }
function lastPerf(name, before){
  const all=allSessions(); for(let i=all.length-1;i>=0;i--){ const s=all[i]; if(s.date>=before) continue;
    if(!s.ex) continue; const ex=s.ex.find(e=>e.name.toLowerCase()===name.toLowerCase()); if(ex){ const ds=doneSets(ex); if(ds.length) return {date:s.date,sets:ds}; } }
  return null;
}
function bestBefore(name, before){ let b=0; for(const s of allSessions()){ if(s.date>=before) continue; if(!s.ex) continue; const ex=s.ex.find(e=>e.name.toLowerCase()===name.toLowerCase()); if(ex) for(const st of doneSets(ex)) b=Math.max(b,e1rm(num(st.w),num(st.r))); } return b; }
const setsStr = sets => sets.map(s=>`${f1(num(s.w))}×${num(s.r)}`).join(", ");
function volume(s){ let v=0,n=0; if(s&&s.ex) for(const e of s.ex) for(const st of doneSets(e)){ v+=num(st.w)*num(st.r); n++; } return {v,n}; }

/* ================= storage ================= */
function saveLocal(){ try{localStorage.setItem("gymlog-v1",JSON.stringify(S))}catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem("gymlog-v1"); if(r){ const d=JSON.parse(r); S={...S,...d,settings:{...S.settings,...(d.settings||{})}}; migrate(); } }catch(e){} }
function migrate(){ if(S.settings.planVersion!==PLAN_VERSION){ S.settings.templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); S.settings.planVersion=PLAN_VERSION; return true; } return false; }
const timers={};
function saveWeek(ws, delay=700){ saveLocal(); if(!weeksCol) return; clearTimeout(timers[ws]);
  timers[ws]=setTimeout(()=>writeSafe(weeksCol.doc(ws), S.weeks[ws]||{sessions:{}}), delay); }
function saveMain(delay=400){ saveLocal(); if(!mainRef) return; clearTimeout(timers.main);
  timers.main=setTimeout(()=>writeSafe(mainRef,{settings:S.settings,bw:S.bw,protein:S.protein,cals:S.cals}),delay); }
async function writeSafe(ref,data){
  try{ await ref.set(JSON.parse(JSON.stringify(data))); }
  catch(e){ if(e&&e.code==="unavailable"){ setTimeout(()=>ref.set(JSON.parse(JSON.stringify(data))).catch(()=>{}),900+Math.random()*900); }
    else flash("Saved on this device only — cloud sync isn't available right now."); }
}
async function connect(){
  try{
    const db=await claude.use("db"), user=await claude.use("user"); if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    mainRef=db.doc(`data/users/${id}/main`); weeksCol=db.collection(`data/users/${id}/main/weeks`);
    const [m,w]=await Promise.all([mainRef.get(), weeksCol.limit(1000).get()]);
    if(m.exists||!w.empty){
      if(m.exists){ const d=m.data(); S.settings={...S.settings,...(d.settings||{})}; S.bw=Array.isArray(d.bw)?[...d.bw]:[];
        const cp=JSON.parse(JSON.stringify(d.protein||{})); let extra=false; for(const [k,v] of Object.entries(S.protein||{})) if(!cp[k]&&v&&v.length){ cp[k]=v; extra=true; }
        S.protein=cp; S.cals=JSON.parse(JSON.stringify(d.cals||{})); if(migrate()||extra) saveMain(0); }
      const weeks={}; w.docs.forEach(doc=>{ weeks[doc.id]=JSON.parse(JSON.stringify(doc.data())); });
      const push=new Set();
      for(const [ws,wk] of Object.entries(S.weeks)) for(const [d,ss] of Object.entries(wk.sessions||{})){
        weeks[ws]=weeks[ws]||{sessions:{}}; weeks[ws].sessions=weeks[ws].sessions||{};
        if(!weeks[ws].sessions[d]){ weeks[ws].sessions[d]=ss; push.add(ws); } }
      S.weeks=weeks; push.forEach(ws=>saveWeek(ws,0));
      saveLocal(); renderAll();
    } else if(S.bw.length||Object.keys(S.weeks).length){ saveMain(0); Object.keys(S.weeks).forEach(ws=>saveWeek(ws,0)); }
  }catch(e){ mainRef=null; weeksCol=null; }
}
function flash(t){ const m=document.querySelector(".msg"); if(m) m.textContent=t; }

/* ================= top: week strip ================= */
function renderTop(){
  const ws=weekStart(sel), t=today();
  $("weekLbl").textContent = ws===weekStart(t) ? "This week" : `Week of ${fmtD(ws)}`;
  let html="", trained=0, sets=0, vol=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), s=session(d), act=sessionActive(s);
    if(act){ trained++; if(!s.kind||s.kind==="lifting"){ const v=volume(s); sets+=v.n; vol+=v.v; } }
    const lbl=s?TYPES[s.type]:(d<t?"Off":"—");
    const cls=["dayb", !s?"rest":"", act?"done":"", d===sel?"sel":"", d===t?"today":""].join(" ");
    html+=`<button type="button" class="${cls}" data-d="${d}" aria-label="${fmtLong(d)}, ${s?TYPES[s.type]+(act?", done":", started"):"nothing logged"}">
      <div class="dw">${DOW[i]}</div><div class="dt">${lbl}</div><div class="dd">${fmtD(d)}</div></button>`;
  }
  $("strip").innerHTML=html;
  const chips=trainTypes().map(k=>{ let on=false; for(let i=0;i<7;i++){ const x=session(addDays(ws,i)); if(x&&x.type===k&&sessionActive(x)) on=true; }
    return `<span class="chip ${on?"on":""}">${TYPES[k]}${on?" ✓":""}</span>`; }).join("");
  $("weekSum").innerHTML = `<strong>${trained} of 5</strong> sessions · <strong>${sets}</strong> sets · <strong>${Math.round(vol).toLocaleString()} kg</strong> volume<span class="chips">${chips}</span>`;
}
$("strip").addEventListener("click",e=>{ const b=e.target.closest(".dayb"); if(!b) return; sel=b.dataset.d; tab="train"; renderAll(); });
$("prevW").onclick=()=>{ sel=addDays(sel,-7); renderAll(); };
$("nextW").onclick=()=>{ sel=addDays(sel,7); renderAll(); };
document.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(!b) return; tab=b.dataset.t; renderAll(); });

/* ================= WORKOUT ================= */
function buildSession(d,type){
  if(isCardio(type)){ return cardioMode(type)==="time"
      ? { type, kind:"cardio", mode:"time", finished:false, cardio:{hrs:"",mins:"",note:""} }
      : { type, kind:"cardio", mode:"distance", finished:false, cardio:{dist:"",mins:"",secs:"",note:""} }; }
  return { type, kind:"lifting", finished:false, note:"", ex:(S.settings.templates[type]||[]).map(t=>{
    const lp=lastPerf(t.name,d); const n=Math.max(t.sets||3,1);
    return { name:t.name, sets:Array.from({length:Math.max(n,lp?lp.sets.length:0)},()=>({w:"",r:"",done:false})) };
  })};
}
function putSession(d,s){ const ws=weekStart(d); S.weeks[ws]=S.weeks[ws]||{sessions:{}}; S.weeks[ws].sessions=S.weeks[ws].sessions||{}; if(s) S.weeks[ws].sessions[d]=s; else delete S.weeks[ws].sessions[d]; saveWeek(ws); }

function renderTrain(){
  const s=session(sel);
  if(!s){
    const future=sel>today();
    return `<div class="dayhead"><div><h2>${sel===today()?"Today":fmtLong(sel).split(",")[0]}</h2><div class="sub">${fmtLong(sel)}${future?"":" · nothing logged"}</div></div></div>
      <p style="margin:0 0 10px;font-weight:600">${sel===today()?"What are you training today?":future?"Plan a workout for this day:":"What did you train this day?"}</p>
      <div class="picks" id="dayPicks">${typeButtons(sel)}</div>
      <p class="muted" style="font-size:.9rem;margin-top:12px">Pick any day type — do them in whatever order suits you. Your last numbers show next to every set so you can beat them.</p>`;
  }
  const type=s.type;
  if(s.kind==="cardio") return renderCardio(s,type);
  const v=volume(s);
  let html=`<div class="dayhead"><div><h2>${TYPES[type]} day</h2><div class="sub">${fmtLong(sel)}</div></div>
    <div class="typepick"><button class="btn ghost small" data-act="discard">⇄ Change workout</button></div></div>
    <div class="sessbar"><div><div class="k cond" id="sbSets">${v.n}</div><div class="l">sets done</div></div>
      <div><div class="k cond" id="sbVol">${Math.round(v.v).toLocaleString()}</div><div class="l">kg volume</div></div>
      <div><div class="k cond" id="sbPR">0</div><div class="l">PRs</div></div><div class="sp"></div>
      <button class="btn small ${s.finished?"ghost":""}" data-act="finish">${s.finished?"Finished ✓":"Finish workout"}</button></div>
    <div class="ordbar"><span class="muted">${s.ex.length} exercises</span><button class="btn ghost small" data-act="reorder">↕ Change order</button></div>`;
  s.ex.forEach((ex,ei)=>{
    const lp=lastPerf(ex.name,sel);
    html+=`<section class="ex" data-ei="${ei}"><div class="exhead"><h3 class="exname" style="margin:0"><button class="exlink" data-act="hist" data-n="${esc(ex.name)}">${esc(ex.name)} <span aria-hidden="true">›</span></button></h3>
      <div class="exctl"><button class="link" data-act="exup" aria-label="Move ${esc(ex.name)} up" ${ei===0?"disabled":""}>↑</button><button class="link" data-act="exdown" aria-label="Move ${esc(ex.name)} down" ${ei===s.ex.length-1?"disabled":""}>↓</button><button class="link" data-act="exdel">Remove</button></div></div>
      <p class="last">${lp?`Beat last time: add a rep or a little weight on any set.`:"First time logging this — set a baseline."} <span class="exsum"></span></p>
      <table class="sets"><thead><tr><th>Set</th><th class="lastc">${lp?"Last · "+fmtD(lp.date):"Last"}</th><th>kg</th><th>Reps</th><th></th><th></th></tr></thead><tbody>`;
    ex.sets.forEach((st,si)=>{
      const L=lp&&lp.sets[si];
      html+=`<tr data-si="${si}" class="${st.done?"isdone":""}"><td class="sn">${si+1}</td>
        <td class="lastc"><span class="lastv">${L?`${f1(num(L.w))}<small>kg</small> × ${num(L.r)}`:"—"}</span><span class="cmp"></span></td>
        <td><input type="number" inputmode="decimal" step="0.5" min="0" data-f="w" value="${esc(st.w)}" placeholder="${L?f1(num(L.w)):""}" aria-label="${esc(ex.name)} set ${si+1} weight in kg"></td>
        <td><input type="number" inputmode="numeric" step="1" min="0" data-f="r" value="${esc(st.r)}" placeholder="${L?num(L.r):""}" aria-label="${esc(ex.name)} set ${si+1} reps"></td>
        <td class="chk"><button type="button" class="tick" data-act="tick" aria-pressed="${st.done}" aria-label="Mark set ${si+1} done">✓</button><span class="prb">PR</span></td>
        <td class="x"><button class="link" data-act="setdel" aria-label="Delete set ${si+1}">✕</button></td></tr>`;
    });
    html+=`</tbody></table><div class="exfoot"><button class="link" data-act="setadd">+ Add set</button></div></section>`;
  });
  html+=`<div class="addex"><input id="newEx" placeholder="Add an exercise, e.g. Cable Fly" list="exList"><button class="btn ghost small" data-act="exadd">Add</button></div>
    <datalist id="exList">${allExerciseNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="notes"><label for="note">Session notes</label><textarea id="note" placeholder="How did it feel? Energy, sleep, anything to change next time">${esc(s.note||"")}</textarea></div>
    <p class="msg" role="status"></p>`;
  return html;
}
function cardioHistory(type, before){ const out=[]; const tmode=cardioMode(type)==="time";
  for(const ss of allSessions()){ if(ss.type!==type||ss.kind!=="cardio") continue; if(before&&ss.date>=before) continue;
    const c=ss.cardio||{};
    const mins = (ss.mode==="time"||tmode) ? (+c.hrs||0)*60+(+c.mins||0) : (+c.mins||0)+(+c.secs||0)/60;
    out.push({date:ss.date, dist:+c.dist||0, mins, note:c.note||""}); }
  return out; }
function hm(mins){ if(!(mins>0)) return "—"; const h=Math.floor(mins/60), m=Math.round(mins%60); return h?`${h}h ${m}m`:`${m}m`; }
function pace(dist,mins){ if(!(dist>0)||!(mins>0)) return null; const p=mins/dist; const m=Math.floor(p), sgp=Math.round((p-m)*60); return `${m}:${String(sgp).padStart(2,"0")}`; }
function renderCardio(s,type){
  const timeMode = (s.mode==="time") || cardioMode(type)==="time";
  const c=s.cardio||(s.cardio=timeMode?{hrs:"",mins:"",note:""}:{dist:"",mins:"",secs:"",note:""});
  const hist=cardioHistory(type,sel), last=hist[hist.length-1];
  let html=`<div class="dayhead"><div><h2>${esc(TYPES[type])}</h2><div class="sub">${fmtLong(sel)}</div></div>
    <div class="typepick"><button class="btn ghost small" data-act="discard">⇄ Change</button></div></div>`;
  if(timeMode){
    const mins=(+c.hrs||0)*60+(+c.mins||0);
    html+=`<div class="cardioform time">
      <div class="cf"><label for="cHrs">Hours</label><input id="cHrs" data-cf="hrs" type="number" inputmode="numeric" min="0" value="${esc(c.hrs)}" placeholder="1"></div>
      <div class="cf"><label for="cMin">Minutes</label><input id="cMin" data-cf="mins" type="number" inputmode="numeric" min="0" max="59" value="${esc(c.mins)}" placeholder="30"></div>
    </div>`;
    html+=`<div class="sessbar"><div><div class="k cond" id="sbA">${mins?hm(mins):"—"}</div><div class="l">played</div></div><div class="sp"></div>
      <button class="btn small ${s.finished?"ghost":""}" data-act="finish">${s.finished?"Finished ✓":"Finish"}</button></div>`;
  } else {
    const dist=+c.dist||0, mins=(+c.mins||0)+(+c.secs||0)/60, pc=pace(dist,mins);
    html+=`<div class="cardioform">
      <div class="cf"><label for="cDist">Distance (km)</label><input id="cDist" data-cf="dist" type="number" inputmode="decimal" step="0.1" min="0" value="${esc(c.dist)}" placeholder="${last&&last.dist?f1(last.dist):"5.0"}"></div>
      <div class="cf"><label for="cMin">Time — min</label><input id="cMin" data-cf="mins" type="number" inputmode="numeric" min="0" value="${esc(c.mins)}" placeholder="30"></div>
      <div class="cf"><label for="cSec">sec</label><input id="cSec" data-cf="secs" type="number" inputmode="numeric" min="0" max="59" value="${esc(c.secs)}" placeholder="00"></div>
    </div>`;
    html+=`<div class="sessbar"><div><div class="k cond" id="sbA">${dist?f1(dist):"—"}</div><div class="l">km</div></div>
      <div><div class="k cond" id="sbB">${mins?f1(mins):"—"}</div><div class="l">minutes</div></div>
      <div><div class="k cond" id="sbC">${pc||"—"}</div><div class="l">pace /km</div></div><div class="sp"></div>
      <button class="btn small ${s.finished?"ghost":""}" data-act="finish">${s.finished?"Finished ✓":"Finish"}</button></div>`;
  }
  // WHOOP slot
  const wc = whoop.connected && whoop.days && whoop.days[sel]!=null ? Math.round(whoop.days[sel]) : null;
  html+=`<div class="wslot">${ whoop.connected
    ? `<span class="muted">WHOOP calories for this day:</span> <b class="cond">${wc!=null?wc+" kcal":"not reported yet"}</b>`
    : `<span class="muted">Start a session on your WHOOP before you ${timeMode?"play":"run"} — once WHOOP is connected (Bulk tab), that session's calories and heart rate attach here.</span>` }</div>`;
  if(last && hist.length>1){ const prev=hist[hist.length-2];
    html+=`<p class="last" style="margin-top:12px">Last ${esc(TYPES[type])} (${fmtD(prev.date)}): ${timeMode?hm(prev.mins):`${f1(prev.dist)} km in ${f1(prev.mins)} min${pace(prev.dist,prev.mins)?` · ${pace(prev.dist,prev.mins)}/km`:""}`}</p>`; }
  html+=`<div class="notes"><label for="cNote">Notes</label><textarea id="cNote" data-cf="note" placeholder="${timeMode?'How did it go? Effort, how you felt':'How did it feel? Route, weather, effort'}">${esc(c.note||"")}</textarea></div>`;
  if(hist.length){ html+=`<h3>Your ${esc(TYPES[type])} history</h3><div class="tbl"><table class="list"><thead><tr><th>Date</th>${timeMode?"<th>Time played</th>":"<th>Distance</th><th>Time</th><th>Pace</th>"}</tr></thead><tbody>`+
    hist.slice().reverse().map(h=>`<tr><td>${fmtDY(h.date)}</td>${timeMode?`<td class="cond">${hm(h.mins)}</td>`:`<td class="cond">${h.dist?f1(h.dist)+" km":"—"}</td><td class="cond">${h.mins?f1(h.mins)+" min":"—"}</td><td class="cond">${pace(h.dist,h.mins)||"—"}</td>`}</tr>`).join("")+`</tbody></table></div>`; }
  html+=`<p class="msg" role="status"></p>`;
  return html;
}
function updatePRs(){
  const s=session(sel); if(!s||s.kind==="cardio"||!s.ex) return; let prs=0;
  s.ex.forEach((ex,ei)=>{ const best=bestBefore(ex.name,sel); let running=best; const lp=lastPerf(ex.name,sel), lastSets=lp?lp.sets:[]; let up=0;
    ex.sets.forEach((st,si)=>{ const row=document.querySelector(`.ex[data-ei="${ei}"] tr[data-si="${si}"]`); if(!row) return;
      const val=st.done?e1rm(num(st.w),num(st.r)):0; const isPR=best>0&&val>running+0.01; if(isPR){prs++;running=val;}
      row.classList.toggle("pr",isPR); row.classList.toggle("isdone",!!st.done);

  else if(act==="exdown"){ if(ei<s.ex.length-1){ [s.ex[ei+1],s.ex[ei]]=[s.ex[ei],s.ex[ei+1]]; } }
  else if(act==="reorder"){ openOrder(); return; }
  else if(act==="exadd"){ const n=$("newEx").value.trim(); if(!n) return; const lp=lastPerf(n,sel);

  putSession(sel,s); renderAll();
});

/* ================= LIFT PROGRESS ================= */
function allExerciseNames(){ const set=new Map(); for(const t of Object.values(S.settings.templates||{})) if(Array.isArray(t)) for(const x of t) set.set(x.name.toLowerCase(),x.name);
  for(const s of allSessions()) if(s.ex) for(const x of s.ex) set.set(x.name.toLowerCase(),x.name); return [...set.values()]; }
let progEx=null, progCardio=null, histMetric="top", cardioMetric="dist";
function renderProgress(){
  if(progCardio) return renderCardioHist(progCardio);
  return progEx ? renderExHistory(progEx) : renderExList();
}
function renderCardioHist(type){
  const h=cardioHistory(type,null); const timeMode=cardioMode(type)==="time";
  let html=`<button class="link back" data-act="histback">‹ All history</button><h2 class="hname">${esc(TYPES[type])}</h2>`;

    const tot=h.reduce((a,b)=>a+b.mins,0), longest=h.reduce((a,b)=>b.mins>a.mins?b:a);
    html+=`<div class="stats"><div class="stat"><div class="v">${hm(tot)}</div><div class="l">Total time logged</div></div>
      <div class="stat"><div class="v">${hm(longest.mins)}</div><div class="l">Longest, ${fmtD(longest.date)}</div></div>
      <div class="stat"><div class="v">${hm(Math.round(tot/h.length))}</div><div class="l">Average session</div></div>
      <div class="stat"><div class="v">${h.length}</div><div class="l">Sessions</div></div></div>`;
    const pts=h.map(x=>[x.date,x.mins]).filter(p=>p[1]>0);
    html+=`<div class="chart">${pts.length?lineChart([{pts,color:"var(--plate)",w:3}],null," min"):'<div class="empty">Not enough data yet.</div>'}</div>
      <div class="legend"><span><i style="background:var(--plate)"></i>Minutes per session</span></div>`;
    html+=`<h3>All ${esc(TYPES[type])} sessions</h3><div class="tbl"><table class="list"><thead><tr><th>Date</th><th>Time played</th><th>Notes</th></tr></thead><tbody>`+
      h.slice().reverse().map(x=>`<tr><td>${fmtDY(x.date)}</td><td class="cond">${hm(x.mins)}</td><td class="n">${esc(x.note||"")}</td></tr>`).join("")+`</tbody></table></div>`;
    return html;
  }
  const far=h.reduce((a,b)=>b.dist>a.dist?b:a), tot=h.reduce((a,b)=>a+b.dist,0);
  const best=h.filter(x=>x.dist>0&&x.mins>0).reduce((a,b)=>(!a||b.mins/b.dist<a.mins/a.dist)?b:a,null);
  html+=`<div class="stats"><div class="stat"><div class="v">${f1(tot)}</div><div class="l">Total km logged</div></div>
    <div class="stat"><div class="v">${f1(far.dist)}</div><div class="l">Longest, ${fmtD(far.date)}</div></div>
    <div class="stat"><div class="v">${best?pace(best.dist,best.mins):"—"}</div><div class="l">Best pace /km</div></div>
    <div class="stat"><div class="v">${h.length}</div><div class="l">Sessions</div></div></div>`;
  const M={dist:["Distance (km)",x=>x.dist],pace:["Pace (min/km)",x=>x.dist>0&&x.mins>0?x.mins/x.dist:null],mins:["Time (min)",x=>x.mins]};
  html+=`<div class="seg" role="group">${Object.entries(M).map(([k,v])=>`<button data-act="cmetric" data-m="${k}" aria-pressed="${k===cardioMetric}">${{dist:"Distance",pace:"Pace",mins:"Time"}[k]}</button>`).join("")}</div>`;
  const pts=h.map(x=>[x.date,M[cardioMetric][1](x)]).filter(p=>p[1]!=null);
  html+=`<div class="chart">${pts.length?lineChart([{pts,color:"var(--plate)",w:3}],null,cardioMetric==="dist"?" km":cardioMetric==="mins"?" min":""):'<div class="empty">Not enough data for this graph yet.</div>'}</div>`;
  html+=`<h3>All ${esc(TYPES[type])} sessions</h3><div class="tbl"><table class="list"><thead><tr><th>Date</th><th>Distance</th><th>Time</th><th>Pace</th><th>Notes</th></tr></thead><tbody>`+
    h.slice().reverse().map(x=>`<tr><td>${fmtDY(x.date)}</td><td class="cond">${x.dist?f1(x.dist)+" km":"—"}</td><td class="cond">${x.mins?f1(x.mins)+" min":"—"}</td><td class="cond">${pace(x.dist,x.mins)||"—"}</td><td class="n">${esc(x.note||"")}</td></tr>`).join("")+`</tbody></table></div>`;

function renderExList(){
  const groups=trainTypes().filter(t=>!isCardio(t)).map(t=>({t,names:(S.settings.templates[t]||[]).map(x=>x.name)}));
  const inPlan=new Set(groups.flatMap(g=>g.names.map(n=>n.toLowerCase())));
  const other=allExerciseNames().filter(n=>!inPlan.has(n.toLowerCase()));
  if(other.length) groups.push({t:null,names:other});
  let html=`<p class="muted" style="margin-top:0">Tap an exercise to see its progression graph and every weight you've recorded.</p>`;
  const cardioTypes=trainTypes().filter(t=>isCardio(t)).filter(t=>cardioHistory(t,null).length);
  if(cardioTypes.length){ html+=`<h3 style="margin-top:4px">Activities</h3><div class="exlist">`;
    for(const t of cardioTypes){ const h=cardioHistory(t,null), last=h[h.length-1];
      html+=`<button class="exrow" data-act="chist" data-k="${t}"><span class="en">${esc(TYPES[t])}</span><span class="es">${last?`${cardioMode(t)==="time"?hm(last.mins):f1(last.dist)+" km · "+(pace(last.dist,last.mins)||f1(last.mins)+" min")} · ${fmtD(last.date)} · ${h.length} logged`:"none yet"}</span><span class="chev">›</span></button>`; }
    html+=`</div>`; }
  for(const g of groups){
    html+=`<h3 style="margin-top:18px">${g.t?TYPES[g.t]+" day":"Other exercises"}</h3><div class="exlist">`;
    for(const n of g.names){ const ser=seriesFor(n), last=ser[ser.length-1];
      let delta=""; if(ser.length>1){ const d=last.top-ser[ser.length-2].top; delta=`<span class="${d>0?"pos":d<0?"neg":"muted"}">${d>0?"▲":d<0?"▼":"="}</span>`; }
      html+=`<button class="exrow" data-act="hist" data-n="${esc(n)}"><span class="en">${esc(n)}</span>
        <span class="es">${last?`${delta} ${f1(last.top)} kg × ${last.topR} · ${fmtD(last.date)} · ${ser.length} session${ser.length>1?"s":""}`:"No sets logged yet"}</span><span class="chev" aria-hidden="true">›</span></button>`; }
    html+=`</div>`;
  }
  return html;
}
function renderExHistory(name){
  const ser=seriesFor(name);
  let html=`<button class="link back" data-act="histback">‹ All exercises</button><h2 class="hname">${esc(name)}</h2>`;
  if(!ser.length) return html+`<div class="empty">No completed sets for ${esc(name)} yet. Tick off sets in a workout and your history shows up here.</div>`;
  const best=ser.reduce((a,b)=>b.e>a.e?b:a), heavy=ser.reduce((a,b)=>(b.top>a.top||(b.top===a.top&&b.topR>a.topR))?b:a);
  const first=ser[0], last=ser[ser.length-1];
  html+=`<div class="stats"><div class="stat"><div class="v">${f1(last.top)}×${last.topR}</div><div class="l">Latest top set, ${fmtD(last.date)}</div></div>
    <div class="stat"><div class="v">${f1(heavy.top)}×${heavy.topR}</div><div class="l">Heaviest ever, ${fmtD(heavy.date)}</div></div>
    <div class="stat"><div class="v ${last.top-first.top>0?"pos":last.top-first.top<0?"neg":""}">${ser.length>1?signed(last.top-first.top)+" kg":"—"}</div><div class="l">Top set since ${fmtD(first.date)}</div></div>
    <div class="stat"><div class="v">${ser.length}</div><div class="l">Sessions recorded</div></div></div>`;
  const M={top:["Top set weight (kg)",p=>p.top],e:["Estimated 1-rep max (kg)",p=>p.e],vol:["Total volume (kg)",p=>p.vol],reps:["Total reps",p=>p.reps]};
  html+=`<div class="seg" role="group" aria-label="Chart metric">${Object.entries(M).map(([k,v])=>`<button data-act="metric" data-m="${k}" aria-pressed="${k===histMetric}">${{top:"Top weight",e:"Est. 1RM",vol:"Volume",reps:"Reps"}[k]}</button>`).join("")}</div>`;
  html+=`<div class="chart">${lineChart([{pts:ser.map(p=>[p.date,M[histMetric][1](p)]),color:"var(--plate)",w:3}],null,histMetric==="vol"||histMetric==="reps"?"":" kg")}</div>
    <div class="legend"><span><i style="background:var(--plate)"></i>${M[histMetric][0]} per session</span></div>`;
  const maxSets=Math.max(...ser.map(p=>p.sets.length));
  html+=`<h3>All recorded sets</h3><p class="muted" style="margin:-4px 0 8px;font-size:.9rem">kg × reps, newest first</p>
    <div class="tbl"><table class="list hist"><thead><tr><th>Date</th>${Array.from({length:maxSets},(_,i)=>`<th>Set ${i+1}</th>`).join("")}<th>Top vs prev</th><th>Volume</th></tr></thead><tbody>`+
    ser.map((p,i)=>{ const prev=ser[i-1]; let c="—",cls="muted";
      if(prev){ const dw=p.top-prev.top, dr=p.topR-prev.topR;
        if(dw>0){c=`▲ +${f1(dw)} kg`;cls="pos";} else if(dw<0){c=`▼ ${f1(dw)} kg`;cls="neg";}
        else if(dr>0){c=`▲ +${dr} rep${dr>1?"s":""}`;cls="pos";} else if(dr<0){c=`▼ ${dr} rep${dr<-1?"s":""}`;cls="neg";} else {c="= same";} }
      else c="First";
      return `<tr><td><b>${fmtD(p.date)}</b><br><span class="muted" style="font-size:.8rem">${parse(p.date).getFullYear()} · ${TYPES[p.type]||""}</span></td>`+
        Array.from({length:maxSets},(_,k)=>{const st=p.sets[k]; return `<td class="cond sc">${st?`${f1(num(st.w))}<small> kg</small> × ${num(st.r)}`:""}</td>`;}).join("")+
        `<td class="${cls}" style="white-space:nowrap;font-weight:600">${c}</td><td class="cond">${Math.round(p.vol).toLocaleString()}</td></tr>`; }).reverse().join("")+
    `</tbody></table></div>`;
  return html;
}
function seriesFor(name){ const out=[]; if(!name) return out;
  for(const s of allSessions()){ if(!s.ex) continue; const ex=s.ex.find(e=>e.name.toLowerCase()===name.toLowerCase()); if(!ex) continue; const ds=doneSets(ex); if(!ds.length) continue;
    let e=0,top=0,topR=0,vol=0; ds.forEach(st=>{const w=num(st.w),r=num(st.r); e=Math.max(e,e1rm(w,r)); if(w>top||(w===top&&r>topR)){top=w;topR=r;} vol+=w*r;});
    out.push({date:s.date,type:s.type,e,top,topR,vol,reps:ds.reduce((a,x)=>a+num(x.r),0),sets:ds}); }
  return out; }

/* ================= WEEKLY ================= */
function renderWeekly(){
  const byWeek={}; for(const s of allSessions()){ if(!sessionActive(s)||s.type==="rest") continue; const ws=weekStart(s.date); const v=volume(s);
    byWeek[ws]=byWeek[ws]||{n:0,sets:0,vol:0,types:[]}; byWeek[ws].n++; byWeek[ws].sets+=v.n; byWeek[ws].vol+=v.v; byWeek[ws].types.push(TYPES[s.type]); }
  const keys=Object.keys(byWeek).sort(); if(!keys.length) return `<div class="empty">Finish your first workout and your weekly totals appear here.</div>`;
  // fill gaps for last 12 weeks window
  const end=weekStart(today()), start=keys[0]; const ws=[]; for(let w=end;w>=start&&ws.length<12;w=addDays(w,-7)) ws.unshift(w);
  const cur=byWeek[end]||{n:0,sets:0,vol:0}, prev=byWeek[addDays(end,-7)]||{n:0,sets:0,vol:0};
  const streak=(()=>{let n=0; for(let w=addDays(end,(byWeek[end]&&byWeek[end].n>=5)?0:-7);byWeek[w]&&byWeek[w].n>=5;w=addDays(w,-7)) n++; return n;})();
  let html=`<div class="stats"><div class="stat"><div class="v">${cur.n}/5</div><div class="l">Sessions this week</div></div>
    <div class="stat"><div class="v">${Math.round(cur.vol).toLocaleString()}</div><div class="l">Volume this week (kg)</div></div>
    <div class="stat"><div class="v ${cur.vol-prev.vol>=0?"pos":"neg"}">${prev.vol?signed((cur.vol-prev.vol)/prev.vol*100)+"%":"—"}</div><div class="l">Volume vs last week</div></div>
    <div class="stat"><div class="v">${streak}</div><div class="l">Full weeks in a row (5/5)</div></div></div>`;
  html+=`<div class="chart">${barChart(ws.map(w=>({lbl:fmtD(w),v:(byWeek[w]||{}).vol||0,n:(byWeek[w]||{}).n||0})))}</div>
    <div class="legend"><span><i style="background:var(--plate);height:10px"></i>Weekly volume (kg), sessions shown above each bar</span></div>`;
  html+=`<h3>Week by week</h3><div class="tbl"><table class="list"><thead><tr><th>Week of</th><th>Sessions</th><th>Days trained</th><th>Sets</th><th>Volume (kg)</th></tr></thead><tbody>`+
    keys.slice().reverse().map(k=>{const w=byWeek[k];return `<tr><td>${fmtDY(k)}</td><td class="cond">${w.n}/5</td><td>${w.types.join(", ")}</td><td class="cond">${w.sets}</td><td class="cond">${Math.round(w.vol).toLocaleString()}</td></tr>`}).join("")+`</tbody></table></div>`;
  return html;
}

/* ================= BODYWEIGHT ================= */
function renderBody(){
  const E=S.bw, g=S.settings.goalKg;
  let html=`<div class="formrow"><div><label for="bwW">Weight (kg)</label><input id="bwW" type="number" inputmode="decimal" step="0.1" min="20" max="300"></div>
    <div><label for="bwD">Date</label><input id="bwD" type="date" value="${today()}"></div>
    <div class="wide"><label for="bwGoal">Goal weight (kg)</label><input id="bwGoal" type="number" inputmode="decimal" step="0.1" value="${g??""}"></div>
    <div class="wide"><button class="btn" data-act="bwsave">Save weigh-in</button></div></div><p class="msg" role="status"></p>`;
  if(!E.length) return html+`<div class="empty">Log a weekly weigh-in (same day, same time, ideally first thing in the morning) to see your trend toward ${g?f1(g)+" kg":"your goal"}.</div>`;
  const first=E[0], last=E[E.length-1];
  const wk=Math.max(1,Math.round((parse(last.date)-parse(first.date))/6048e5));
  const rate=E.length>1?(last.kg-first.kg)/wk:0, left=g!=null?g-last.kg:null;
  let eta="—"; if(left!=null){ if(Math.abs(left)<0.05) eta="Reached"; else if(E.length>1&&Math.sign(rate)===Math.sign(left)&&Math.abs(rate)>0.01) eta=`~${Math.ceil(Math.abs(left/rate))} wks`; }
  html+=`<div class="stats"><div class="stat"><div class="v">${f1(last.kg)}</div><div class="l">Current (kg), ${fmtD(last.date)}</div></div>
    <div class="stat"><div class="v">${E.length>1?signed(last.kg-first.kg):"—"}</div><div class="l">Since ${fmtD(first.date)}</div></div>
    <div class="stat"><div class="v">${E.length>1?signed(rate):"—"}</div><div class="l">Average per week (kg)</div></div>

function bulkChart(days){

  if(pts.length>1) g+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--goal)" stroke-width="3" stroke-linejoin="round"/>`;
  days.forEach((d,i)=>{ if(out[i]!=null){ const x=m.l+i*bw+bw*.5; g+=`<circle cx="${x}" cy="${Y(out[i])}" r="3.5" fill="var(--goal)"><title>${fmtD(d)}: ${Math.round(out[i])} burned</title></circle>`; } });

    const taken=new Set(dayTypeList().map(x=>x.key)); let k=key,n=2; while(taken.has(k)) k=key+"-"+(n++);
    S.settings.dayTypes=S.settings.dayTypes||[]; S.settings.dayTypes.push(kind==="cardio"?{key:k,name,kind,mode}:{key:k,name,kind});
    if(kind==="lifting"){ S.settings.templates=S.settings.templates||{}; S.settings.templates[k]=[{name:"New exercise",sets:3}]; }
    saveMain(); renderAll(); flash(`Added ${name}.`); return; }
  if(act==="dtren"){ const k=b.dataset.k, d=(S.settings.dayTypes||[]).find(x=>x.key===k); if(!d) return;
    const nm=prompt("Rename day type",d.name); if(nm&&nm.trim()){ d.name=nm.trim(); saveMain(); renderAll(); } return; }
  if(act==="dtdel"){ const k=b.dataset.k, d=(S.settings.dayTypes||[]).find(x=>x.key===k); if(!d) return;
    const used=allSessions().some(ss=>ss.type===k);
    askConfirm(`Delete "${d.name}"?`, used?`You've logged days with this type. Those stay in your history, but you won't be able to pick it for new days.`:`It will be removed from your day choices.`,"Delete").then(ok=>{ if(!ok) return;
      S.settings.dayTypes=(S.settings.dayTypes||[]).filter(x=>x.key!==k); if(S.settings.templates) delete S.settings.templates[k]; saveMain(); renderAll(); }); return; }
  const sec=b.closest(".plan"), t=sec&&sec.dataset.t, L=t&&S.settings.templates[t], row=b.closest(".prow"), i=row?+row.dataset.i:-1;
  if(act==="padd") L.push({name:"New exercise",sets:3});
  else if(act==="pdel") L.splice(i,1);
  else if(act==="pup"&&i>0) [L[i-1],L[i]]=[L[i],L[i-1]];
  else if(act==="pdown"&&i<L.length-1) [L[i+1],L[i]]=[L[i],L[i+1]];
  else if(act==="ptop"&&i>0) L.unshift(L.splice(i,1)[0]);
  else if(act==="preset"){ askConfirm("Reset your plan?","Every day type goes back to the default exercises. Your logged workouts aren't affected.","Reset plan").then(ok=>{ if(!ok) return; S.settings.templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); S.settings.planVersion=PLAN_VERSION; saveMain(); renderAll(); }); return; }
  saveMain(); renderAll();
  if(act==="padd"){ const ins=document.querySelectorAll(`.plan[data-t="${t}"] [data-pf="name"]`); const last=ins[ins.length-1]; last.focus(); last.select(); }
}

/* ================= charts ================= */
function lineChart(series, goal, unit=" kg"){
  const box=$("view"); const W=Math.max(340,Math.min(880,box.clientWidth||800)), H=Math.round(Math.max(220,Math.min(320,W*.4)));
  const m={l:46,r:14,t:18,b:32};
  const all=series.flatMap(s=>s.pts); const ts=all.map(p=>parse(p[0]).getTime());
  let ys=all.map(p=>p[1]); if(goal!=null) ys=ys.concat(goal);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pd=Math.max(1,(hi-lo)*.15); lo=Math.floor(lo-pd); hi=Math.ceil(hi+pd);
  const t0=Math.min(...ts), t1=Math.max(...ts), single=t1===t0;
  const X=t=>single?(m.l+(W-m.l-m.r)/2):m.l+(t-t0)/(t1-t0)*(W-m.l-m.r), Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  let g=""; const st=niceStep((hi-lo)/4);
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow">${+v.toFixed(1)}</text>`;
  const uniq=[...new Set(all.map(p=>p[0]))].sort(); const every=Math.ceil(uniq.length/Math.max(2,Math.floor((W-m.l-m.r)/72)));
  uniq.forEach((d,i)=>{ if(i%every===0||i===uniq.length-1) g+=`<text x="${X(parse(d).getTime())}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow">${fmtD(d)}</text>`; });
  if(goal!=null){ const gy=Y(goal); g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${gy}" y2="${gy}" stroke="var(--goal)" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-m.r}" y="${gy-6}" text-anchor="end" font-size="12" font-weight="700" fill="var(--goal)" font-family="Barlow">Goal ${f1(goal)} kg</text>`; }
  series.forEach(s=>{ const P=s.pts.map(p=>[X(parse(p[0]).getTime()),Y(p[1]),p]);
    if(P.length>1) g+=`<path d="${P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.w}" ${s.dash?`stroke-dasharray="${s.dash}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`;
    P.forEach((p,i)=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===P.length-1?6:4}" fill="${i===P.length-1?s.color:"var(--bg)"}" stroke="${s.color}" stroke-width="2"><title>${fmtDY(p[2][0])}: ${f1(p[2][1])}${unit}</title></circle>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}</svg>`;
}
function barChart(items){
  const W=Math.max(340,Math.min(880,$("view").clientWidth||800)), H=240, m={l:54,r:10,t:26,b:30};
  const max=Math.max(1,...items.map(i=>i.v)); const st=niceStep(max/4), top=Math.ceil(max/st)*st;
  const Y=v=>m.t+(1-v/top)*(H-m.t-m.b); const bw=(W-m.l-m.r)/items.length;
  let g=""; for(let v=0;v<=top+1e-9;v+=st) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow">${v>=1000?f1(v/1000)+"k":v}</text>`;
  items.forEach((it,i)=>{ const x=m.l+i*bw+bw*.18, w=bw*.64, y=Y(it.v);
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,H-m.b-y)}" rx="4" fill="var(--plate)" opacity="${it.n>=5?1:.55}"><title>${it.lbl}: ${Math.round(it.v).toLocaleString()} kg, ${it.n} sessions</title></rect>`;
    if(it.n) g+=`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Barlow">${it.n}/5</text>`;
    if(i%Math.ceil(items.length/Math.floor((W-m.l)/64))===0||i===items.length-1) g+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow">${it.lbl}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume chart">${g}</svg>`;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

/* ================= render ================= */
function renderAll(){
  renderTop();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.t===tab));
  const v=$("view");
  v.innerHTML = tab==="train"?renderTrain(): tab==="protein"?renderProtein(): tab==="progress"?renderProgress(): tab==="weekly"?renderWeekly(): tab==="bulk"?renderBulk(): tab==="body"?renderBody(): renderPlan();
  if(tab==="train") updatePRs();
}
let rt, lastW=window.innerWidth;
window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  // Only redraw charts when the WIDTH changes (rotation). The phone keyboard only changes height.
  if(Math.abs(window.innerWidth-lastW)<40) return; lastW=window.innerWidth;
  const a=document.activeElement; if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")) return;
  if(tab!=="train"&&tab!=="plan") renderAll(); },200); });
function openPicker(){
  const t=today(), s=session(t);
  if(s){ sel=t; tab="train"; renderAll(); return; }

  $("pickDate").textContent=fmtLong(t);
  $("picks").innerHTML=typeButtons(t)+`<button class="pk rest" data-k="rest"><b>Rest day</b><span>Taking it off</span></button>`;
  $("pick").hidden=false; setTimeout(()=>{ const f=document.querySelector(".pk.sched")||document.querySelector(".pk"); f&&f.focus(); },30);
}
function lastOfType(k,before){ let d=null; for(const s of allSessions()) if(s.type===k&&s.date<before&&sessionActive(s)) d=s.date; return d; }
let ordMoved=-1;
function renderOrder(){ const s=session(sel); if(!s) return; const n=s.ex.length;
  $("ordType").textContent=TYPES[s.type];
  $("ordList").innerHTML=s.ex.map((x,i)=>`<li class="${i===ordMoved?"moved":""}"><span class="on">${i+1}</span><span class="nm">${esc(x.name)}</span><span class="bt">
    <button data-o="top" data-i="${i}" aria-label="Make ${esc(x.name)} first" ${i===0?"disabled":""}>⤒</button>
    <button data-o="up" data-i="${i}" aria-label="Move ${esc(x.name)} up" ${i===0?"disabled":""}>↑</button>
    <button data-o="down" data-i="${i}" aria-label="Move ${esc(x.name)} down" ${i===n-1?"disabled":""}>↓</button></span></li>`).join(""); }
function openOrder(){ ordMoved=-1; renderOrder(); $("ord").hidden=false; setTimeout(()=>$("ordDone").focus(),20); }
$("ordList").addEventListener("click",e=>{ const b=e.target.closest("button[data-o]"); if(!b||b.disabled) return; const s=session(sel); const i=+b.dataset.i, o=b.dataset.o, L=s.ex;
  let j=i; if(o==="top"){ L.unshift(L.splice(i,1)[0]); j=0; } else if(o==="up"){ [L[i-1],L[i]]=[L[i],L[i-1]]; j=i-1; } else { [L[i+1],L[i]]=[L[i],L[i+1]]; j=i+1; }
  ordMoved=j; putSession(sel,s); renderOrder();
  const nb=$("ordList").querySelector(`button[data-o="${o}"][data-i="${j}"]`)||$("ordList").querySelector(`li:nth-child(${j+1}) button:not(:disabled)`); nb&&nb.focus(); });
function closeOrder(){ const s=session(sel); $("ord").hidden=true;
  if(s&&$("ordSave").checked){ const T=S.settings.templates[s.type]||[]; const pos=n=>{ const k=s.ex.findIndex(x=>x.name.toLowerCase()===n.toLowerCase()); return k<0?999:k; };
    S.settings.templates[s.type]=T.map((x,i)=>({x,i})).sort((a,b)=>(pos(a.x.name)-pos(b.x.name))||(a.i-b.i)).map(o=>o.x); saveMain(); }
  renderAll(); }
$("ordDone").onclick=closeOrder;
$("ord").addEventListener("click",e=>{ if(e.target.id==="ord") closeOrder(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("ord").hidden) closeOrder(); });
let cfmRes=null;
function askConfirm(title,body,okLabel){ $("cfmT").textContent=title; $("cfmB").textContent=body; $("cfmOk").textContent=okLabel;
  $("cfm").hidden=false; setTimeout(()=>$("cfmNo").focus(),20); return new Promise(r=>{ cfmRes=r; }); }
function closeCfm(v){ $("cfm").hidden=true; if(cfmRes){ const r=cfmRes; cfmRes=null; r(v); } }
$("cfmOk").onclick=()=>closeCfm(true); $("cfmNo").onclick=()=>closeCfm(false);
$("cfm").addEventListener("click",e=>{ if(e.target.id==="cfm") closeCfm(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("cfm").hidden) closeCfm(false); });
function closePicker(){ $("pick").hidden=true; }
$("picks").addEventListener("click",e=>{ const b=e.target.closest(".pk"); if(!b) return; const k=b.dataset.k, t=today();
  closePicker(); sel=t; tab="train";
  if(k!=="rest" && !session(t)) putSession(t,buildSession(t,k));
  renderAll(); window.scrollTo(0,0); });
$("pickSkip").onclick=closePicker;
$("pick").addEventListener("click",e=>{ if(e.target.id==="pick") closePicker(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("pick").hidden) closePicker(); });

loadLocal(); renderAll(); openPicker();
if(new URLSearchParams(location.search).get("whoop")){ history.replaceState(null,"",location.pathname); }
whoopRefresh();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
let openDay=today();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&today()!==openDay){ openDay=today(); sel=today(); tab="train"; protDay=today(); renderAll(); openPicker(); } });
</script>
